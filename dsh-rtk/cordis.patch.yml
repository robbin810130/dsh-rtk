# dsh-rtk bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile web add dsh-rtk@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-rtk` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# into the composition, and the plugin's `apply()` runs at server boot —
# before any agent session mounts its bash tool.
#
# The plugin patches the installed `@deepseek-ai/dsh-tool-bash` and
# `@deepseek-ai/dsh-tool-bash-persistent` packages (idempotent, anchored on
# content markers) so every bash command the agent runs is rewritten via
# `rtk rewrite` first. Because the patch re-applies on EVERY boot, a DSH
# update that overwrites node_modules is healed automatically on the next
# restart — no manual re-run needed.
#
# To disable the RTK rewriting at runtime, set the env var DSH_RTK_DISABLE=1
# (or prepend it to a single command). To opt out of this plugin entirely,
# remove it: `dsh plugin --profile web remove dsh-rtk`.
- insert:
    - id: dsh-rtk
      name: 'dsh-rtk'
